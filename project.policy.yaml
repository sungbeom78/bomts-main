# project.policy.yaml -- dev-process-framework 프로젝트 정책 (init_project 생성)
# 전체 기본값: dev-process-framework/policy/defaults.yaml
project:
  name: bomts-main
  mode: solo            # solo: 업무 규칙 변경만 사용자 확인, 나머지 자동 승인 / team: 모두 확인
  profile: standard

qa:
  levels:
    quick: "./scripts/check.sh"
    standard: "./scripts/check.sh"
    full: "./scripts/check.sh"

check_commands:         # verify 가 실행할 명령. builtin:* 은 프레임워크 내장 검사
  lint: builtin:syntax  # .py/.json/.html(태그·인라인 script)/.js 문법 -- JS 는 node 가 있어야 검사
  encoding: builtin:encoding
  example_sync: "./dev-process/local/scripts/check-framework-sync.sh"
  identifier_audit: builtin:identifier_audit
  unit_or_regression: "./scripts/check.sh"

check_inputs:           # 검사별 입력 -- 바뀌면 이전 PASS 가 무효(stale)가 된다
  lint: [site, scripts]
  unit_or_regression: [site, scripts, docs/manual, AGENTS.md, docker-compose.yml, nginx]
  encoding: [site, scripts, docs]
  example_sync: [dev-process-framework, AGENTS.md, .agents/skills, .claude/skills, .gitignore]
  identifier_audit: [scripts, glossary/dictionary]
  qa_quick: [site, scripts, docs/manual, AGENTS.md, docker-compose.yml, nginx]

verification_exemptions: {}   # 예: {code: {identifier_audit: "사유"}}

prior_art:
  change_log: CHANGELOG.md
  days: 30

glossary:
  root: ./glossary
  # 업무 영역 순서 (앞=일반, 뒤=구체) -- 뜻·약어를 뒤에서부터 찾는다 (glossary/doc/glossary_area_rule.md)
  # 예: [general, school, nursing, nursing_mgmt, data]  (data = DB 분류어 영역: no=번호, at=시각 ...)
  # areas: [general]
  enforcement:
    new_or_renamed: strict      # 새 식별자는 사전 단어만
    legacy: advisory

user_manual:
  dir: docs/manual
  index: index.html
  audience: engineer
  architecture_chapter: architecture.html
  admin_chapter: admin.html
  required_for_change_kinds: [new_project, new_feature, usage_change]

data_model:
  stance: external
  ref: "sungbeom78/bomts-infra:mail/mailu/data-map.md"
  reason: >-
    정적 웹사이트는 업무 데이터를 저장하지 않는다. Self-hosted Mailu의 계정·Mailbox·메일 상태는 Private bomts-infra 데이터 지도와
    persistent storage가 정본이며, 다른 BOMTS 서비스의 데이터는 각 소유 저장소에서 관리한다.
