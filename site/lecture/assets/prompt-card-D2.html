<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 프롬프트 카드</title>
<!-- 프롬프트카드 뷰어 · 교안 v0.3 · 원본은 프롬프트카드_D2.txt — _강사용/update_card_pages.py 가 이 파일을 다시 만듭니다 (직접 고치지 마세요) -->
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --sub:#5b6573; --line:#e3e6eb; --soft:#eef1f5;
  --code-bg:#f3f5f8; --code-ink:#16202c; --accent:#1f3a68; --accent-ink:#ffffff;
  --ok:#157347; --ok-bg:#e8f5ee; --tip:#9a6100; --tip-bg:#fff6e0; --meta-bg:#f2f5fa;
  --hit:#fff1a8; --shadow:0 1px 2px rgba(16,24,40,.06);
  --w1:#5b6b80; --w2:#0f8a7e; --w3a:#d63a2f; --w3b:#2563eb; --wg:#c27100; --w4:#4f46e5; --w6:#e0601b;
  --w7a:#16a34a; --w7b:#9333ea; --w8:#d0347a;
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --panel:#181d25; --ink:#e7ebf0; --sub:#9aa4b2; --line:#2a313c; --soft:#212833;
    --code-bg:#0f1319; --code-ink:#e3e8ee; --accent:#8fb3ff; --accent-ink:#0b1220;
    --ok:#5fd394; --ok-bg:#15291f; --tip:#f2b84b; --tip-bg:#2a2214; --meta-bg:#1d2430;
    --hit:#5a4b00; --shadow:none;
    --w1:#9fb0c6; --w2:#3cc7b8; --w3a:#ff7b70; --w3b:#7aa7ff; --wg:#f3a93a; --w4:#9d97ff; --w6:#ff9a5c;
    --w7a:#58d483; --w7b:#c992ff; --w8:#ff7fb5;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --panel:#181d25; --ink:#e7ebf0; --sub:#9aa4b2; --line:#2a313c; --soft:#212833;
  --code-bg:#0f1319; --code-ink:#e3e8ee; --accent:#8fb3ff; --accent-ink:#0b1220;
  --ok:#5fd394; --ok-bg:#15291f; --tip:#f2b84b; --tip-bg:#2a2214; --meta-bg:#1d2430;
  --hit:#5a4b00; --shadow:none;
  --w1:#9fb0c6; --w2:#3cc7b8; --w3a:#ff7b70; --w3b:#7aa7ff; --wg:#f3a93a; --w4:#9d97ff; --w6:#ff9a5c;
  --w7a:#58d483; --w7b:#c992ff; --w8:#ff7fb5;
}
*{box-sizing:border-box}
html{scroll-padding-top:170px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.65 "Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
/* ── 위 막대 ── */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:1.1em;letter-spacing:-.01em}
.src{font-size:.8em;color:var(--sub);white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{width:230px;max-width:52vw;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9em}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:.85em;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;padding:0 20px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;color:var(--sub);white-space:nowrap;font-size:.92em}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .x{font-size:.75em;color:var(--sub);margin-left:6px}
.wins{display:flex;gap:6px;align-items:center;padding:8px 20px 10px;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:thin}
.wins .lbl{font-size:.78em;color:var(--sub);white-space:nowrap;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:.8em;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.w::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.chip.w[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.chip.w[aria-pressed=true]::before{background:#fff}
.sec.intro.fold > :not(h2){display:none}
.sec.intro > h2.tg{cursor:pointer;user-select:none}
.sec.intro > h2.tg::after{content:"접기 ▴";font-size:.6em;font-weight:400;color:var(--sub);margin-left:10px;vertical-align:2px}
.sec.intro.fold > h2.tg::after{content:"펼치기 ▾"}
.sec.intro.first{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 18px 10px;margin-top:18px}
.sec.intro.first > h2{margin-top:14px;border-bottom:0;font-size:1.08em}
/* ── 본문 ── */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1220px;margin:0 auto;padding:22px 20px 80px}
#toc{position:sticky;top:150px;align-self:start;max-height:calc(100vh - 170px);overflow:auto;font-size:.84em;padding-right:6px}
#toc a{display:block;color:var(--sub);text-decoration:none;padding:3px 8px;border-left:2px solid transparent;line-height:1.4}
#toc a:hover{color:var(--ink)}
#toc a.h2{color:var(--ink);font-weight:700;margin-top:10px}
#toc a.h3{padding-left:16px}
#toc a.on{border-left-color:var(--accent);color:var(--ink);background:var(--soft)}
#toc a.dim{display:none}
main{min-width:0}
main h1{font-size:1.55em;line-height:1.3;margin:0 0 4px;letter-spacing:-.02em}
main h1 + p{color:var(--sub);margin:0 0 18px;font-size:.92em}
.sec > h2{font-size:1.25em;margin:34px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink);letter-spacing:-.01em}
.sec.intro > h2{border-bottom-color:var(--line)}
.sec h3{font-size:1.06em;margin:0}
.intro h3{margin:18px 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.card > .hd{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:10px}
.card > .hd .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;max-width:45%}
main p{margin:8px 0}
main ul{margin:8px 0;padding-left:1.2em}
main li{margin:4px 0}
main table{border-collapse:collapse;width:100%;font-size:.92em;margin:8px 0}
main th,main td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
main th{background:var(--soft)}
main td:first-child{white-space:nowrap}
blockquote{margin:10px 0;padding:8px 12px;border-radius:8px;background:var(--meta-bg);border-left:3px solid var(--line)}
blockquote p{margin:0}
blockquote.meta{font-size:.9em;color:var(--sub)}
blockquote.meta strong.k{color:var(--ink);margin-right:6px}
blockquote.ans{background:var(--ok-bg);border-left-color:var(--ok)}
blockquote.ans strong.k{color:var(--ok)}
blockquote.tip{background:var(--tip-bg);border-left-color:var(--tip);font-size:.92em}
blockquote.tip strong.k{color:var(--tip)}
blockquote.info{background:var(--soft);border-left-color:var(--accent)}
strong.k{font-weight:700;margin-right:6px}
code{font-family:"D2Coding","Consolas","Malgun Gothic",monospace;font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:4px}
.pre{position:relative;margin:10px 0}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;padding-right:76px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font:400 .93em/1.7 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
pre code{background:none;padding:0;font:inherit}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;font-size:.8em;cursor:pointer}
.copy:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.copy.done:hover{filter:brightness(1.1);background:var(--ok);color:#fff}
.card:has(.copy.done) > .hd h3::before{content:"✓ ";color:var(--ok)}
.btn.rs b{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 5px;border-radius:999px;background:var(--soft);font-weight:700;font-size:.9em;text-align:center}
.btn.rs:disabled{opacity:.45;cursor:default}
.btn.rs:disabled:hover{background:var(--panel)}
.btn.arm{background:var(--w3a);border-color:var(--w3a);color:#fff}
li.cp{position:relative;padding-right:56px;list-style:none;margin-left:-1.2em;padding-left:1.2em}
li.cp::before{content:"›";position:absolute;left:.25em;color:var(--sub)}
li.cp .copy{top:0;right:0;padding:1px 8px;font-size:.75em}
li.cp:hover{background:var(--soft);border-radius:6px}
td.cpc{position:relative;padding-right:60px}
td.cpc .copy{top:5px;right:5px;padding:1px 8px;font-size:.75em}
.win{display:inline-block;white-space:nowrap;font-weight:700;font-size:.86em;line-height:1.5;padding:0 8px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.pill{display:inline-block;white-space:nowrap;font-size:.8em;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--panel)}
.pill.new{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pill.cont{border-style:dashed}
.pill.gen{background:var(--soft)}
.pill.gem{color:var(--wg);border-color:var(--wg);font-weight:700}
mark{background:var(--hit);color:inherit;border-radius:2px}
.hide{display:none!important}
#empty{color:var(--sub);padding:40px 0;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:.88em;opacity:0;transition:.18s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
#drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:1.3em;font-weight:700;z-index:60}
#drop.on{display:flex}
#tocbtn{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:16px 16px 70px}
  #toc{display:none;position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);max-height:none;background:var(--panel);z-index:40;padding:16px;border-right:1px solid var(--line)}
  #toc.open{display:block}
  #tocbtn{display:inline-block}
  .row{padding:8px 16px}.tabs{padding:0 12px}.wins{padding:6px 16px 8px}
  .tools input[type=search]{width:100%;max-width:none;order:9}
  .tools{width:100%;margin-left:0}
  .card{padding:14px}.card > .hd{flex-direction:column}.card > .hd .tags{max-width:none;justify-content:flex-start}
  html{scroll-padding-top:200px}
}
@media print{
  .top,#toc,.copy,#toast,#drop{display:none!important}
  .wrap{display:block;padding:0}
  body{background:#fff;color:#000}
  .card{break-inside:avoid;box-shadow:none}
  pre{white-space:pre-wrap}
}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><b>D2 프롬프트 카드</b><span class="src" id="src">교안 v0.3</span></div>
    <div class="tools">
      <button class="btn" id="tocbtn" aria-controls="toc">목차</button>
      <input type="search" id="q" placeholder="찾기 (예: CARD 2, 소방용수, 정답)" aria-label="카드 찾기">
      <button class="btn" id="fsm" title="글자 작게" aria-label="글자 작게">가−</button>
      <button class="btn" id="fsp" title="글자 크게 (빔 프로젝터)" aria-label="글자 크게">가+</button>
      <button class="btn" id="theme" title="밝게/어둡게 바꾸기">화면</button>
      <button class="btn rs" id="rsall" title="모든 탭의 '복사됨' 표시를 지웁니다">전체 복사 버튼 초기화 <b>0</b></button>
      <button class="btn rs" id="rsview" title="지금 화면(이 탭 · 창별로 보기 · 찾기 조건)에 보이는 카드의 '복사됨' 표시만 지웁니다">현재 창 복사 버튼 초기화 <b>0</b></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="파일"></nav>
  <div class="wins" id="wins" aria-label="채팅 창으로 거르기"></div>
</header>
<div class="wrap">
  <aside id="toc" aria-label="목차"></aside>
  <main id="doc"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

var DATA = {"ver": "v0.3", "docs": [{"name": "전체", "md": "# D2 · 프롬프트 카드 — 공공데이터 활용 · 분석 · 시각화\n\nFIRE-AI 2026 · 수강생 배포용 · 실습 도구: Gemini (gemini.google.com) · 교안 v0.3 기준 · 2026-10-09\n\n## 시작하기 전에\n\n### 카드 읽는 법\n\n- **교안 페이지** 각 카드 아래 '▶ 교안 p.NN'은 강원소방학교_AI데이터활용_2일차_v0.3.pptx 기준입니다. 교안 페이지가 바뀌면 update_card_pages.py로 다시 맞춥니다.\n- **채팅 창** 각 카드 아래 '▶ 채팅'이 넣을 창입니다. 일반 채팅 = Gem 없이 gemini.google.com 새 채팅 / Gem ①②③ = 강사가 준 Gem 링크로 연 채팅. '새 채팅'이면 새 창을 열고, '이어서'면 [창 이름]이 같은 창으로 돌아갑니다. 왼쪽 목록의 채팅 이름을 [창 3-A 화재]처럼 바꿔 두면 헷갈리지 않습니다 (채팅 ⋮ → 이름 바꾸기).\n\n### 채팅 창 지도\n\n| 창 | 쓰는 채팅 |\n|---|---|\n| **[창 1 업무질문]** | 일반 |\n| **[창 2 탐색]** | 일반 |\n| **[창 2-G Gem①]** | Gem① |\n| **[창 3-A 화재]** | 일반 |\n| **[창 3-B 소방용수]** | 일반 |\n| **[창 3-G Gem②]** | Gem② |\n| **[창 4 분석]** | 일반, 4\\~6교시 |\n| **[창 6 Gem③]** | Gem③ |\n| **[창 7-A 캔버스]** | 일반 |\n| **[창 7-G Gem②]** | Gem② |\n| **[창 7-B 분석]** | 일반 |\n| **[창 8 대시보드]** | 일반+Canvas |\n\n### 사용법\n\n- 각 카드의 회색 상자 안 내용을 통째로 복사(Ctrl+C) → Gemini 입력창에 붙여넣기(Ctrl+V) → 보내기. HTML 뷰어에서는 상자 오른쪽 위 [복사] 버튼을 누르면 됩니다.\n- [대괄호] 부분만 내 상황에 맞게 바꿉니다. 대괄호가 없는 카드는 그대로 씁니다.\n- 파일이 필요한 카드는 먼저 입력창 [+] → [파일 업로드]로 파일을 올리고, 카드를 붙여넣습니다.\n- 같은 데이터로 이어지는 카드는 같은 채팅에서 계속합니다(파일 다시 올릴 필요 없음). 새 데이터로 바꿀 때는 [새 채팅]에서 시작합니다.\n- 스킬(Gem) 링크를 받았다면 Gem에서 해당 카드의 '짧은 입력'만 써도 됩니다.\n- 2026-11-17부터 Gemini의 Gem은 '스킬'로 바뀝니다. 수업 후에는 스킬을 쓰세요: 설정 → 스킬 → ↑ 업로드(11월이후_스킬 폴더의 lecture-*.zip) → 새 채팅에서 / 로 선택 → 같은 '짧은 입력'.\n\n### 공통 규칙 3줄 — 모든 카드에 이미 들어 있습니다\n\n① 모르면 '확인 필요'  ② 데이터에 없는 값은 만들지 않기  ③ 숫자는 코드로 계산, 결과는 표로\n\n## 1교시 · 업무 질문 만들기\n\n### 실습 0 — 내 업무 질문 다듬기\n\n> **채팅** 일반 채팅 · 새 채팅 → **[창 1 업무질문]**  \n> **교안** p.21 프롬프트 · 20 작성 안내\n\n```text\n너는 공공기관 데이터 활용 코치야.\n아래는 내가 쓴 업무 질문이야.\n\n[내 질문] 나는 [업무] 업무에서 [판단·행동]을 위해 [무엇이 · 어디/언제/누구별로] 어떤지 알고 싶다.\n\n1. 이 질문이 '대상 · 비교 기준 · 행동' 3요건을 갖췄는지 ✔/✕ 표로 점검해줘.\n2. 3요건을 모두 갖춘 질문으로 3가지 버전을 제안해줘. (좁게 / 보통 / 넓게)\n3. 각 버전에 답하려면 필요한 정보 2~3개를 '○○별 ○○의 건수/비율/추세' 형태로 적어줘.\n\n개인정보나 내부자료가 필요한 질문이면 '공개 데이터로는 불가'라고 표시하고,\n모르는 내용은 '확인 필요'라고 써줘.\n```\n\n## 2교시 · 공공데이터 탐색과 출처 검증\n\n### CARD 0 — 공공데이터 탐색·판별 (일반 채팅용 전체판)\n\n> **채팅** 일반 채팅 · 새 채팅 → **[창 2 탐색]**  \n> ※ 아래 Gem ①판과 둘 중 하나만  \n> **교안** p.34 프롬프트 · 35 예상 결과 · 36 소스카드 작성 · 37 소스카드 예시\n\n```text\n나는 [소방본부 예방안전과]에서 아래 질문에 답하고 싶어.\n\n[업무 질문] 화재 예방 활동을 강원 어느 지역 · 어느 시기 · 어떤 원인에 집중해야 하는가?\n[필요한 컬럼] 발생일시, 시군구, 발화요인, 장소, 사망, 부상, 재산피해\n\n1. 검색어 5개를 먼저 제안해줘 (현장 용어 + 행정 용어 동의어 포함).\n2. 공공데이터 후보 3개를 아래 표로 정리해줘.\n   데이터명 | 제공기관 | 공식 URL | 기준일 | 형식 | 행 단위 | 주요 컬럼 | 필요 컬럼 충족(✔/✕) | 한계\n3. 추천 우선순위 1~3과 이유를 한 줄씩.\n4. 마지막에 '사람이 직접 확인할 것 3가지'를 적어줘.\n\n규칙: 실제로 확인되지 않은 URL · 데이터명 · 기준일은 만들지 말고 '확인 필요'로 표시해.\n공식 기관 페이지만 출처로 써.\n```\n\n### CARD 0 — Gem ① 「공공데이터 탐색·판별」용 짧은 입력\n\n> **채팅** Gem ① · 새 채팅 (Gem ① 링크를 열고 시작) → **[창 2-G Gem①]**  \n> ※ 위 일반 채팅판([창 2 탐색])과 둘 중 하나만  \n> **교안** p.34 프롬프트 ('스킬 사용 시' 줄) · 33 스킬 ① 설명 · 113 요청사항 원문\n\n```text\n나는 [소방본부 예방안전과]에서 [화재 예방 활동을 어디·언제 집중할지 정하기] 위해\n[강원 시군별·월별·원인별 화재와 피해]가 어떤지 알고 싶다.\n필요한 컬럼: [발생일시, 시군구, 발화요인, 장소, 사망, 부상, 재산피해]\n```\n\n### 이어서 쓰는 문장 (2교시)\n\n> **채팅** 이어서 — CARD 0을 넣은 그 창 그대로 (**[창 2 탐색]** 일반 채팅 또는 **[창 2-G Gem①]**)  \n> **교안** p.38 막힐 때 표\n\n- 소스카드 표만 다시 보여줘.\n- 2순위 후보의 공식 URL을 다시 확인해줘. 확인이 안 되면 '확인 필요'로 바꿔줘.\n- 필요한 컬럼 중 없는 것이 있으면, 대신 쓸 수 있는 다른 공공데이터를 1개 찾아줘.\n\n## 3교시 · 데이터 이해 · 품질 점검 · 전처리  (스킬: Gem ② 「데이터 정제·검증」)\n\n### CARD 1 — 이해시키기 (화재 원본) · 파일: 소방청_연간화재통계_20241231.csv\n\n> **채팅** 일반 채팅 · 새 채팅 (화재 원본 업로드) → **[창 3-A 화재]**  \n> **교안** p.44 프롬프트 · 45 예상 결과\n\n```text\n너는 소방본부의 데이터 정제 담당자야.\n첨부한 파일은 공공데이터포털의 「소방청_연간화재통계_20241231」 원본이야.\n1행이 제목줄이고 2행부터 데이터야.\n\n아직 분석하지 말고, 이 파일을 이해한 대로 표로 설명해줘.\n1. 파일 인코딩(UTF-8 / CP949 등)과 한글이 제대로 읽혔는지\n2. 전체 행 수 · 열 수, 1행이 무엇 1건인지\n3. 열 목록 · 각 열의 의미 · 형식(날짜 / 범주 / 숫자) · 예시값\n4. '시도' 열의 고유값 개수와 시도별 행 수\n5. '일시'의 가장 이른 값 ~ 가장 늦은 값\n6. 재산피해소계의 단위 추정과 그 근거\n\n파이썬 코드로 직접 세어서 답하고, 확실하지 않은 것은\n지어내지 말고 '확인 필요'라고 써줘.\n```\n\n> **정답** CP949 · 37,614행 × 17열 · 17개 시도 · 강원특별자치도 1,900행 · 재산피해 천원 단위\n\n### CARD 2-2 — 강원 추출 · 열 선택 · 파생 (같은 채팅에서 이어서)\n\n> **채팅** 일반 채팅 · 이어서 — **[창 3-A 화재]** (CARD 1을 넣은 창)  \n> **교안** p.46 프롬프트 · 47 예상 결과\n\n```text\n같은 파일로 계속하자. 아래 순서대로 정리해줘.\n\n1. '시도'가 '강원특별자치도'인 행만 남겨줘.\n2. 아래 14개 열만 남겨줘.\n   일시, 시도, 시_군_구, 화재유형, 발화열원대분류, 발화요인대분류,\n   발화요인소분류, 최초착화물대분류, 인명피해(명)소계, 사망, 부상,\n   재산피해소계, 장소대분류, 장소중분류\n3. 새 열 3개를 추가해줘 (원본 열은 지우지 마).\n   월 = 일시의 월 / 계절 = 봄(3~5) 여름(6~8) 가을(9~11) 겨울(12~2)\n   재산피해_억원 = 재산피해소계 ÷ 100,000 (소수점 둘째 자리)\n4. 처리 전후 행 수와 '원본 = 제외 + 최종' 검증식을 보여줘.\n5. 시_군_구 고유값이 18개인지 확인해줘.\n6. 결과를 '강원_화재_2024_정제.csv'(UTF-8 BOM) 파일로 다운로드할 수 있게 만들어줘.\n\n없는 값은 만들지 말고 비워 둬.\n```\n\n> **정답** 37,614 = 35,714 + 1,900 · 시군 18개 · 봄 541 / 여름 494 / 가을 388 / 겨울 477\n\n> **참고** 다운로드가 안 되면: 강사 배포본 '강원_화재_2024_정제.csv'를 사용합니다.\n\n### CARD 2 — 품질 진단 (정제 게임) · [새 채팅] · 파일: 강원특별자치도_소방용수시설_20251231_실습용.csv\n\n> **채팅** 일반 채팅 · 새 채팅 (소방용수 실습판 업로드) → **[창 3-B 소방용수]**  \n> ※ Gem ②에 넣지 않습니다  \n> **교안** p.48 프롬프트 · 49 처리 규칙 정하기 · 50 정답 함정 6\n\n```text\n너는 데이터 품질 점검 담당자야.\n첨부한 파일은 「강원특별자치도_소방용수시설_20251231」 실습용 파일이야.\n데이터는 아직 수정하지 마. 아래 6가지를 파이썬 코드로 점검해서 표로 보여줘.\n\n① 결측: 열별 빈칸 건수와 비율 (특히 위도 · 경도 · 설치연도 · 출수압력)\n② 중복: 모든 값이 같은 행 / 모든 칸이 빈 행\n③ 형식: 설치연도가 4자리 숫자가 아닌 값의 종류와 건수\n④ 이상치: 설치연도 1950년 이전 · 2025년 이후,\n        위도 37~38.7 / 경도 127~129.5 범위 밖 좌표\n⑤ 범주: 시군구명 고유값 목록과 표기가 흔들리는 값\n⑥ 단위·코드: 시설유형코드의 값별 건수와, 코드의 뜻을 아는지\n\n결과는 '문제 | 열 | 건수 | 예시 | 처리 제안(제외/보정/유지)' 표로.\n모르는 것(코드의 뜻 등)은 '확인 필요'.\n```\n\n> **참고** 숨은 함정 6가지는 강사가 정답을 공개합니다. 몇 개 찾았는지 세어 보세요.\n\n> **참고** 찾는 건 AI가 합니다. 여러분은 '지울지 · 고칠지 · 남길지'를 정하면 됩니다.\n\n### CARD 2-2 — 처리 (내가 정한 규칙) · 같은 채팅에서 이어서\n\n> **채팅** 일반 채팅 · 이어서 — **[창 3-B 소방용수]** (CARD 2를 넣은 창)  \n> **교안** p.51 프롬프트 · 52 예상 결과\n\n```text\n위 점검 결과를 아래 규칙대로 처리해줘. 원본 열은 지우지 말고\n새 열을 추가하는 방식으로 해줘.\n\n1. 모든 칸이 빈 행 → 제외\n2. 시군 = 시군구명에서 '원주'를 '원주시'로 바꾼 새 열\n3. 설치연도_정제 = 'YYYY.MM' · 'YYYYMMDD'는 앞 4자리 연도로 보정,\n   1950~2025 범위 밖이거나 숫자가 아니면 빈칸\n4. 출수압력_정제 = 앞뒤 공백 제거 후 숫자, 숫자가 아니면 빈칸\n5. 확인필요 = 설치연도_정제가 빈칸이거나 좌표가 빈칸/범위 밖이면 'Y', 아니면 'N'\n6. 단계별 행 수 변화표와 '원본 = 제외 + 최종' 검증식\n7. 시군별 시설 수 표 (18행인지 확인, 원주시 몇 개인지)\n8. '강원_소방용수_정제.csv'(UTF-8 BOM) 파일로 다운로드할 수 있게 만들어줘.\n\n데이터에 없는 값은 만들지 말고 앞의 분석 결과 4개로 차트를 하나씩 그려줘.\n\n① 월별 화재 건수 → 선 그래프\n② 시군별 화재 건수 → 가로 막대 (큰 순서, 위에서부터)\n③ 발화요인대분류 비중 → 도넛 (상위 4개 + 나머지 '기타')\n④ 시군별 재산피해(억원) → 가로 막대 (큰 순서, 상위 8개)\n\n모든 차트 공통 규칙:\n· 세로축(값 축)은 0부터, 축과 제목에 단위(건 · 억원)\n· 강조색은 1개만 — 가장 중요한 항목에\n· 값 라벨 표시 (천 단위 쉼표)\n· 제목은 '무엇이 보이는가'를 숫자 1개 포함한 한 문장으로\n· 차트 아래에 '출처: 소방청 연간화재통계(2024) · 강원' 한 줄\n```\n\n### 차트 다듬기 — 한 번에 하나씩\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**  \n> **교안** p.81 수정 지시\n\n- 막대를 큰 값부터 위에서 아래로 정렬해줘.\n- 1위 막대만 빨간색, 나머지는 회색으로 바꿔줘.\n- 세로축을 0부터 시작하고, 축 제목에 단위 '건'을 넣어줘.\n- 상위 8개만 보여주고 나머지는 '기타'로 묶어줘.\n- 제목을 결론을 말하는 한 문장으로, 숫자 1개를 넣어서 바꿔줘.\n- 값을 막대 끝에 천 단위 쉼표로 표시해줘.\n- 이 차트의 축 시작값, 단위, 비율의 분모를 알려줘.\n- (차트가 안 그려질 때) 파이썬 코드 실행으로 차트 이미지를 만들어줘.\n\n## 6교시 · 대시보드 (스킬: Gem ③ 「대시보드 빌더」) · 입력창 [도구] → Canvas 켜기\n\n### CARD 5 — 대시보드 (일반 채팅용 전체판) · 파일: 강원_화재_2024_정제.csv\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**에서 입력창 [도구] → Canvas 켜기 (창이 너무 길면 새 채팅 + 정제 CSV 업로드)  \n> ※ 아래 Gem ③판과 둘 중 하나만  \n> **교안** p.85 Canvas 열기 · 87 프롬프트 · 88 예상 결과\n\n```text\n[강원_화재_2024_정제.csv]로 HTML 대시보드 한 장을 Canvas에 만들어줘.\n\n[조건]\n- 파일 하나로 열리는 HTML. 외부 라이브러리 · CDN · 웹폰트 없이, 차트는 SVG로 직접 그려줘.\n- 데이터는 HTML 안에 넣고, 외부 서버로 보내는 코드는 넣지 마.\n- 원자료 1,900행을 그대로 넣지 말고, 파이썬으로 [시군 × 월 × 발화요인] 집계표\n  (건수 · 인명피해 · 재산피해_억원)를 만들어 그 집계표만 넣어줘.\n\n[구성]\n① 제목: [2024 강원 화재 현황]  /  필터: [시군], [월] — 기본값 '전체',\n   필터를 바꾸면 KPI와 모든 차트가 함께 바뀌게\n② KPI 4개: [화재 건수(건)], [인명피해(사망+부상, 명)], [재산피해(억원)], [최다 발화요인과 비율]\n③ 차트 4개: [월별 추이 선], [시군 순위 가로 막대 상위 10], [발화요인 도넛 상위 4 + 기타],\n   [시군별 재산피해 가로 막대 상위 8]\n   — 세로축 0, 제목은 숫자 1개를 포함한 결론 문장, 강조색 1개(빨강), 기본색 남색\n④ 인사이트 2줄: [사실] / [가설] 태그\n⑤ 업무 제안 후보 2개: 누가 · 무엇을 · 언제 + '[담당자 확정]'\n⑥ 하단: 출처(소방청 연간화재통계 2024) · 재산피해 천원→억원 환산 ·\n   한계(출동시간 없음) · 'AI(Gemini) 활용 작성 · 담당자 검증'\n\n먼저 KPI 숫자를 표로 따로 보여주고(검산용), 그다음 HTML을 만들어줘.\n```\n\n> **정답** 1,900건 · 134명 · 264.8억원 · 부주의 45.4% · 시군=강릉시 → 253건\n\n### CARD 5 — Gem ③ 「대시보드 빌더」용 짧은 입력\n\n> **채팅** Gem ③ · 새 채팅 (Gem ③ 링크를 열고 정제 CSV 업로드 · [도구] → Canvas 켜기) → **[창 6 Gem③]**  \n> **교안** p.86 스킬 ③ 설명 · 115 요청사항 원문\n\n```text\n업무 질문: [화재 예방 활동을 강원 어느 지역 · 어느 시기 · 어떤 원인에 집중해야 하는가?]\n필터: [시군, 월]\nKPI: [화재 건수, 인명피해, 재산피해(억원), 최다 발화요인]\n```\n\n> **참고** 설계안이 나오면 확인 후 \"좋아, 만들어줘\"라고 답합니다.\n\n### 대시보드 다듬기 — Canvas에 한 번에 하나씩\n\n> **채팅** 이어서 — 대시보드를 만든 그 창 (**[창 4 분석]** 일반 채팅 또는 **[창 6 Gem③]**)  \n> **교안** p.89 수정 지시 · 90 저장 · 재검산\n\n- 모든 KPI와 차트가 필터 선택에 함께 반응하도록 고쳐줘.\n- `<meta charset=\"UTF-8\">`을 넣고 한글 글꼴을 'Malgun Gothic'으로 지정해줘.\n- 외부 라이브러리 없이 SVG로 차트를 다시 그려줘.\n- 색은 남색 1개 + 강조 빨강 1개만, 그림자 · 애니메이션은 빼줘.\n- 맨 아래에 출처 · 기준일 · 한계 · 'AI 활용 작성 · 담당자 검증'을 추가해줘.\n- KPI 4개의 계산식과 값을 표로 보여줘. 필터 '전체' 기준으로.\n- A4 가로 1쪽에 맞게 인쇄 레이아웃(@media print)을 추가해줘.\n- (Canvas가 안 될 때) 이 대시보드를 HTML 파일 하나로 만들어 코드 블록으로 줘.\n  → 메모장에 붙여넣고 '강원화재_대시보드.html'로 저장 (인코딩 UTF-8)\n\n## 7교시 · CASE 2 나만의 데이터 [새 채팅]\n\n### 캔버스 점검 — 내 설계가 데이터로 가능한지 (파일 첨부 필수)\n\n> **채팅** 일반 채팅 · 새 채팅 (내 데이터 파일 첨부) → **[창 7-A 캔버스]**  \n> **교안** p.100 캔버스 양식 · 101 프롬프트\n\n```text\n너는 공공기관 데이터 분석 코치야. 아래는 내 프로젝트 캔버스야.\n첨부한 파일이 ② 데이터야.\n\n① 업무 질문: [ ]\n② 데이터: [ ]\n③ 필요한 컬럼: 기준열 [ ] / 값열 [ ] / 날짜열 [ ]\n④ KPI: [ ]\n⑤ 차트: [ ]\n⑥ 필터: [ ]\n\n1. ③의 컬럼이 첨부 파일에 실제로 있는지 열 이름으로 확인해줘.\n2. ④ KPI 각각을 이 파일로 계산할 수 있는지 (가능 / 불가 / 수정안).\n3. ④ KPI가 ① 질문에 직접 답하는지 평가해줘.\n4. 50분 안에 끝낼 수 있게 줄인 '최소 버전'을 제안해줘.\n\n파일에 없는 값은 만들지 말고 '불가'라고 써줘.\n```\n\n### 정제 — Gem ② 첫 메시지 (치환판)\n\n> **채팅** Gem ② · 새 채팅 (내 데이터 파일 업로드) → **[창 7-G Gem②]**  \n> ※ Gem이 없으면 일반 채팅 새 채팅에 3교시 CARD 1 → 2 → 2-2 치환  \n> **교안** p.102 프롬프트\n\n```text\n분석 목적: [나는 ○○에서 ○○를 위해 ○○를 알고 싶다]\n첨부 파일은 [데이터명 · 제공기관 · 기준일]이고 1행 = [무엇 1건]이야.\nSTEP 1부터 시작해줘.\n```\n\n### 분석 — CARD 3 치환판\n\n> **채팅** 일반 채팅 · 새 채팅 (나만의_정제.csv 업로드) → **[창 7-B 분석]**  \n> **교안** p.102 프롬프트 · 103 치환표\n\n```text\n[나만의_정제.csv]에서 [기준열]별 [값열]의 건수 / 합계 / 비율을 큰 순서로 표로 보여줘.\n· 가장 높은 항목과 가장 낮은 항목 · 상위 3개가 전체에서 차지하는 비율\n· 계산에 쓴 분모와 제외한 행 수\n원인은 추측하지 말고, 파이썬 코드로 계산해서 숫자로 확인되는 사실만 말해줘.\n```\n\n### 분석 — CARD 3-2 치환판 (날짜 열이 있을 때)\n\n> **채팅** 일반 채팅 · 이어서 — **[창 7-B 분석]**  \n> **교안** p.102 프롬프트 · 103 치환표\n\n```text\n[날짜열]을 월 단위로 묶어 [값열] 건수를 월별 표로 보여주고,\n전월 대비 증감률, 가장 칙대로 처리, 원본 열 유지: [규칙 목록]. 단계별 행 수 · '원본 = 제외 + 최종' · [파일명_정제].csv(UTF-8 BOM). |\n| **CARD 2-3** | '컬럼명\\|의미\\|형식\\|단위·값 범위\\|처리 내역\\|출처' 데이터사전. 첫 줄에 1행 단위 · 기준일 · 원본명 · 행 수. |\n| **CARD 3** | [기준열]별 [값열]의 건수/합계/비율 큰 순서 표. 최고 · 최저, 상위 3개 비중, 분모 · 제외 행. 원인 추측 금지. |\n| **CARD 3-2** | [날짜열] 월 단위 [값열] 추이 · 증감률 · 최다/최소 · 합계 확인. '가능성' 표현. |\n| **CARD 3-3** | [기준열]별 [값열1] 순위 vs [값열2] 순위 나란히 · 차이 큰 항목 · 최대 1건 비중 · 평균 vs 중앙값. |\n| **CARD 4** | 추세=선 · 순위=가로 막대 · 구성=도넛(상위 4+기타). 축 0 · 단위 · 강조색 1 · 값 라벨 · 결론 문장 제목 · 출처. |\n| **CARD 5** | [정제 파일]로 단일 HTML(SVG · 외부 전송 없음 · 집계표 내장). 제목·필터 / KPI / 차트 / 인사이트 / 제안 / 출처·한계. |\n"}, {"name": "1~3교시 · 질문·탐색·정제", "md": "# D2 · 프롬프트 카드 — 공공데이터 활용 · 분석 · 시각화\n\nFIRE-AI 2026 · 수강생 배포용 · 실습 도구: Gemini (gemini.google.com) · 교안 v0.3 기준 · 2026-10-09\n\n> **이 파일** 1\\~3교시 · CASE 1 준비 — 업무 질문 · 공공데이터 탐색 · 정제   (전체본: 프롬프트카드_D2.txt)\n\n## 이 단락에서 쓰는 채팅 창\n\n- **[창 1 업무질문]** — 일반 채팅 (1교시 실습 0)\n- **[창 2 탐색]** — 일반 채팅 (2교시 CARD 0 전체판)\n- **[창 2-G Gem①]** — Gem ① (2교시 CARD 0 '짧은 입력' · 창 2와 둘 중 하나)\n- **[창 3-A 화재]** — 일반 채팅 (3교시 CARD 1 → 2-2)\n- **[창 3-B 소방용수]** — 일반 채팅 (3교시 CARD 2 → 2-2 → 2-3)\n- **[창 3-G Gem②]** — Gem ② (CARD 1\\~2-3 대신 '짧은 입력' 하나 · 이후 '진행'만)\n\n## 시작하기 전에\n\n### 카드 읽는 법\n\n- **교안 페이지** 각 카드 아래 '▶ 교안 p.NN'은 강원소방학교_AI데이터활용_2일차_v0.3.pptx 기준입니다. 교안 페이지가 바뀌면 update_card_pages.py로 다시 맞춥니다.\n- **채팅 창** 각 카드 아래 '▶ 채팅'이 넣을 창입니다. 일반 채팅 = Gem 없이 gemini.google.com 새 채팅 / Gem ①②③ = 강사가 준 Gem 링크로 연 채팅. '새 채팅'이면 새 창을 열고, '이어서'면 [창 이름]이 같은 창으로 돌아갑니다. 왼쪽 목록의 채팅 이름을 [창 3-A 화재]처럼 바꿔 두면 헷갈리지 않습니다 (채팅 ⋮ → 이름 바꾸기).\n\n### 채팅 창 지도\n\n| 창 | 쓰는 채팅 |\n|---|---|\n| **[창 1 업무질문]** | 일반 |\n| **[창 2 탐색]** | 일반 |\n| **[창 2-G Gem①]** | Gem① |\n| **[창 3-A 화재]** | 일반 |\n| **[창 3-B 소방용수]** | 일반 |\n| **[창 3-G Gem②]** | Gem② |\n| **[창 4 분석]** | 일반, 4\\~6교시 |\n| **[창 6 Gem③]** | Gem③ |\n| **[창 7-A 캔버스]** | 일반 |\n| **[창 7-G Gem②]** | Gem② |\n| **[창 7-B 분석]** | 일반 |\n| **[창 8 대시보드]** | 일반+Canvas |\n\n### 사용법\n\n- 각 카드의 회색 상자 안 내용을 통째로 복사(Ctrl+C) → Gemini 입력창에 붙여넣기(Ctrl+V) → 보내기. HTML 뷰어에서는 상자 오른쪽 위 [복사] 버튼을 누르면 됩니다.\n- [대괄호] 부분만 내 상황에 맞게 바꿉니다. 대괄호가 없는 카드는 그대로 씁니다.\n- 파일이 필요한 카드는 먼저 입력창 [+] → [파일 업로드]로 파일을 올리고, 카드를 붙여넣습니다.\n- 같은 데이터로 이어지는 카드는 같은 채팅에서 계속합니다(파일 다시 올릴 필요 없음). 새 데이터로 바꿀 때는 [새 채팅]에서 시작합니다.\n- 스킬(Gem) 링크를 받았다면 Gem에서 해당 카드의 '짧은 입력'만 써도 됩니다.\n- 2026-11-17부터 Gemini의 Gem은 '스킬'로 바뀝니다. 수업 후에는 스킬을 쓰세요: 설정 → 스킬 → ↑ 업로드(11월이후_스킬 폴더의 lecture-*.zip) → 새 채팅에서 / 로 선택 → 같은 '짧은 입력'.\n\n### 공통 규칙 3줄 — 모든 카드에 이미 들어 있습니다\n\n① 모르면 '확인 필요'  ② 데이터에 없는 값은 만들지 않기  ③ 숫자는 코드로 계산, 결과는 표로\n\n## 1교시 · 업무 질문 만들기\n\n### 실습 0 — 내 업무 질문 다듬기\n\n> **채팅** 일반 채팅 · 새 채팅 → **[창 1 업무질문]**  \n> **교안** p.21 프롬프트 · 20 작성 안내\n\n```text\n너는 공공기관 데이터 활용 코치야.\n아래는 내가 쓴 업무 질문이야.\n\n[내 질문] 나는 [업무] 업무에서 [판단·행동]을 위해 [무엇이 · 어디/언제/누구별로] 어떤지 알고 싶다.\n\n1. 이 질문이 '대상 · 비교 기준 · 행동' 3요건을 갖췄는지 ✔/✕ 표로 점검해줘.\n2. 3요건을 모두 갖춘 질문으로 3가지 버전을 제안해줘. (좁게 / 보통 / 넓게)\n3. 각 버전에 답하려면 필요한 정보 2~3개를 '○○별 ○○의 건수/비율/추세' 형태로 적어줘.\n\n개인정보나 내부자료가 필요한 질문이면 '공개 데이터로는 불가'라고 표시하고,\n모르는 내용은 '확인 필요'라고 써줘.\n```\n\n## 2교시 · 공공데이터 탐색과 출처 검증\n\n### CARD 0 — 공공데이터 탐색·판별 (일반 채팅용 전체판)\n\n> **채팅** 일반 채팅 · 새 채팅 → **[창 2 탐색]**  \n> ※ 아래 Gem ①판과 둘 중 하나만  \n> **교안** p.34 프롬프트 · 35 예상 결과 · 36 소스카드 작성 · 37 소스카드 예시\n\n```text\n나는 [소방본부 예방안전과]에서 아래 질문에 답하고 싶어.\n\n[업무 질문] 화재 예방 활동을 강원 어느 지역 · 어느 시기 · 어떤 원인에 집중해야 하는가?\n[필요한 컬럼] 발생일시, 시군구, 발화요인, 장소, 사망, 부상, 재산피해\n\n1. 검색어 5개를 먼저 제안해줘 (현장 용어 + 행정 용어 동의어 포함).\n2. 공공데이터 후보 3개를 아래 표로 정리해줘.\n   데이터명 | 제공기관 | 공식 URL | 기준일 | 형식 | 행 단위 | 주요 컬럼 | 필요 컬럼 충족(✔/✕) | 한계\n3. 추천 우선순위 1~3과 이유를 한 줄씩.\n4. 마지막에 '사람이 직접 확인할 것 3가지'를 적어줘.\n\n규칙: 실제로 확인되지 않은 URL · 데이터명 · 기준일은 만들지 말고 '확인 필요'로 표시해.\n공식 기관 페이지만 출처로 써.\n```\n\n### CARD 0 — Gem ① 「공공데이터 탐색·판별」용 짧은 입력\n\n> **채팅** Gem ① · 새 채팅 (Gem ① 링크를 열고 시작) → **[창 2-G Gem①]**  \n> ※ 위 일반 채팅판([창 2 탐색])과 둘 중 하나만  \n> **교안** p.34 프롬프트 ('스킬 사용 시' 줄) · 33 스킬 ① 설명 · 113 요청사항 원문\n\n```text\n나는 [소방본부 예방안전과]에서 [화재 예방 활동을 어디·언제 집중할지 정하기] 위해\n[강원 시군별·월별·원인별 화재와 피해]가 어떤지 알고 싶다.\n필요한 컬럼: [발생일시, 시군구, 발화요인, 장소, 사망, 부상, 재산피해]\n```\n\n### 이어서 쓰는 문장 (2교시)\n\n> **채팅** 이어서 — CARD 0을 넣은 그 창 그대로 (**[창 2 탐색]** 일반 채팅 또는 **[창 2-G Gem①]**)  \n> **교안** p.38 막힐 때 표\n\n- 소스카드 표만 다시 보여줘.\n- 2순위 후보의 공식 URL을 다시 확인해줘. 확인이 안 되면 '확인 필요'로 바꿔줘.\n- 필요한 컬럼 중 없는 것이 있으면, 대신 쓸 수 있는 다른 공공데이터를 1개 찾아줘.\n\n## 3교시 · 데이터 이해 · 품질 점검 · 전처리  (스킬: Gem ② 「데이터 정제·검증」)\n\n### CARD 1 — 이해시키기 (화재 원본) · 파일: 소방청_연간화재통계_20241231.csv\n\n> **채팅** 일반 채팅 · 새 채팅 (화재 원본 업로드) → **[창 3-A 화재]**  \n> **교안** p.44 프롬프트 · 45 예상 결과\n\n```text\n너는 소방본부의 데이터 정제 담당자야.\n첨부한 파일은 공공데이터포털의 「소방청_연간화재통계_20241231」 원본이야.\n1행이 제목줄이고 2행부터 데이터야.\n\n아직 분석하지 말고, 이 파일을 이해한 대로 표로 설명해줘.\n1. 파일 인코딩(UTF-8 / CP949 등)과 한글이 제대로 읽혔는지\n2. 전체 행 수 · 열 수, 1행이 무엇 1건인지\n3. 열 목록 · 각 열의 의미 · 형식(날짜 / 범주 / 숫자) · 예시값\n4. '시도' 열의 고유값 개수와 시도별 행 수\n5. '일시'의 가장 이른 값 ~ 가장 늦은 값\n6. 재산피해소계의 단위 추정과 그 근거\n\n파이썬 코드로 직접 세어서 답하고, 확실하지 않은 것은\n지어내지 말고 '확인 필요'라고 써줘.\n```\n\n> **정답** CP949 · 37,614행 × 17열 · 17개 시도 · 강원특별자치도 1,900행 · 재산피해 천원 단위\n\n### CARD 2-2 — 강원 추출 · 열 선택 · 파생 (같은 채팅에서 이어서)\n\n> **채팅** 일반 채팅 · 이어서 — **[창 3-A 화재]** (CARD 1을 넣은 창)  \n> **교안** p.46 프롬프트 · 47 예상 결과\n\n```text\n같은 파일로 계속하자. 아래 순서대로 정리해줘.\n\n1. '시도'가 '강원특별자치도'인 행만 남겨줘.\n2. 아래 14개 열만 남겨줘.\n   일시, 시도, 시_군_구, 화재유형, 발화열원대분류, 발화요인대분류,\n   발화요인소분류, 최초착화물대분류, 인명피해(명)소계, 사망, 부상,\n   재산피해소계, 장소대분류, 장소중분류\n3. 새 열 3개를 추가해줘 (원본 열은 지우지 마).\n   월 = 일시의 월 / 계절 = 봄(3~5) 여름(6~8) 가을(9~11) 겨울(12~2)\n   재산피해_억원 = 재산피해소계 ÷ 100,000 (소수점 둘째 자리)\n4. 처리 전후 행 수와 '원본 = 제외 + 최종' 검증식을 보여줘.\n5. 시_군_구 고유값이 18개인지 확인해줘.\n6. 결과를 '강원_화재_2024_정제.csv'(UTF-8 BOM) 파일로 다운로드할 수 있게 만들어줘.\n\n없는 값은 만들지 말고 비워 둬.\n```\n\n> **정답** 37,614 = 35,714 + 1,900 · 시군 18개 · 봄 541 / 여름 494 / 가을 388 / 겨울 477\n\n> **참고** 다운로드가 안 되면: 강사 배포본 '강원_화재_2024_정제.csv'를 사용합니다.\n\n### CARD 2 — 품질 진단 (정제 게임) · [새 채팅] · 파일: 강원특별자치도_소방용수시설_20251231_실습용.csv\n\n> **채팅** 일반 채팅 · 새 채팅 (소방용수 실습판 업로드) → **[창 3-B 소방용수]**  \n> ※ Gem ②에 넣지 않습니다  \n> **교안** p.48 프롬프트 · 49 처리 규칙 정하기 · 50 정답 함정 6\n\n```text\n너는 데이터 품질 점검 담당자야.\n첨부한 파일은 「강원특별자치도_소방용수시설_20251231」 실습용 파일이야.\n데이터는 아직 수정하지 마. 아래 6가지를 파이썬 코드로 점검해서 표로 보여줘.\n\n① 결측: 열별 빈칸 건수와 비율 (특히 위도 · 경도 · 설치연도 · 출수압력)\n② 중복: 모든 값이 같은 행 / 모든 칸이 빈 행\n③ 형식: 설치연도가 4자리 숫자가 아닌 값의 종류와 건수\n④ 이상치: 설치연도 1950년 이전 · 2025년 이후,\n        위도 37~38.7 / 경도 127~129.5 범위 밖 좌표\n⑤ 범주: 시군구명 고유값 목록과 표기가 흔들리는 값\n⑥ 단위·코드: 시설유형코드의 값별 건수와, 코드의 뜻을 아는지\n\n결과는 '문제 | 열 | 건수 | 예시 | 처리 제안(제외/보정/유지)' 표로.\n모르는 것(코드의 뜻 등)은 '확인 필요'.\n```\n\n> **참고** 숨은 함정 6가지는 강사가 정답을 공개합니다. 몇 개 찾았는지 세어 보세요.\n\n> **참고** 찾는 건 AI가 합니다. 여러분은 '지울지 · 고칠지 · 남길지'를 정하면 됩니다.\n\n### CARD 2-2 — 처리 (내가 정한 규칙) · 같은 채팅에서 이어서\n\n> **채팅** 일반 채팅 · 이어서 — **[창 3-B 소방용수]** (CARD 2를 넣은 창)  \n> **교안** p.51 프롬프트 · 52 예상 결과\n\n```text\n위 점검 결과를 아래 규칙대로 처리해줘. 원본 열은 지우지 말고\n새 열을 추가하는 방식으로 해줘.\n\n1. 모든 칸이 빈 행 → 제외\n2. 시군 = 시군구명에서 '원주'를 '원주시'로 바꾼 새 열\n3. 설치연도_정제 = 'YYYY.MM' · 'YYYYMMDD'는 앞 4자리 연도로 보정,\n   1950~2025 범위 밖이거나 숫자가 아니면 빈칸\n4. 출수압력_정제 = 앞뒤 공백 제거 후 숫자, 숫자가 아니면 빈칸\n5. 확인필요 = 설치연도_정제가 빈칸이거나 좌표가 빈칸/범위 밖이면 'Y', 아니면 'N'\n6. 단계별 행 수 변화표와 '원본 = 제외 + 최종' 검증식\n7. 시군별 시설 수 표 (18행인지 확인, 원주시 몇 개인지)\n8. '강원_소방용수_정제.csv'(UTF-8 BOM) 파일로 다운로드할 수 있게 만들어줘.\n\n데이터에 없는 값은 만들지 말고 빈칸으로 둬.\n```\n\n> **정답** 10,574 = 4 + 10,570 · 시군 18개 · 원주시 1,112개 · 확인필요 Y 38행 · 2005년 이전 설치 24.3%\n\n> **참고** 결정을 다르게 했다면 해당 번호 줄만 고쳐서 쓰세요.\n\n### CARD 2-3 — 데이터사전 (같은 채팅에서 이어서)\n\n> **채팅** 일반 채팅 · 이어서 — **[창 3-B 소방용수]**  \n> **교안** p.53 프롬프트 · 54 예시\n\n```text\n정제한 [강원_소방용수_정제.csv]로 데이터사전을 만들어줘.\n\n표 형식:\n컬럼명 | 의미 | 형식 | 단위 · 값 범위 | 처리 내역 | 출처\n\n규칙:\n- 첫 줄에 '1행 = [시설 1개]', 기준일, 원본 파일명, 최종 행 수를 써줘.\n- 처리 내역에는 제외 · 보정 · 유지 건수를 숫자로 적어줘.\n- 새로 만든 열(_정제, 확인필요)은 계산 규칙을 그대로 적어줘.\n- 의미가 불확실한 열(예: 시설유형코드)은 '확인 필요'로 표시해줘.\n```\n\n### Gem ② 「데이터 정제·검증」용 짧은 입력 (CARD 1\\~2-3을 한 번에)\n\n> **채팅** Gem ② · 새 채팅 (Gem ② 링크를 열고 파일 업로드) → **[창 3-G Gem②]**  \n> ※ CARD 1\\~2-3 대신 이것 하나. 이후엔 '진행'만 입력  \n> **교안** p.55 스킬 ② 설명 · 114 요청사항 원문\n\n```text\n분석 목적: [시군별 소방용수시설 수와 2005년 이전 설치 비율을 보고 싶다]\n첨부 파일은 [강원특별자치도_소방용수시설_20251231_실습용 · 강원특별자치도 · 2025-12-31 기준]이고\n1행 = [시설 1개]야. STEP 1부터 시작해줘.\n```\n\n> **참고** STEP 3에서 멈추면 처리 규칙을 직접 정해 주세요. (위 CARD 2-2의 1\\~5번을 붙여넣어도 됩니다)\n\n### 이어서 쓰는 문장 (3교시 · 막힐 때) # 4교시 · CASE 1 분석 — 질문 4개를 숫자로  [새 채팅] · 파일: 강원_화재_2024_정제.csv\n\n### CARD 3 · 질문 ① 어느 시군에서 화재가 많은가? [순위]\n\n> **채팅** 일반 채팅 · 새 채팅 (강원_화재_2024_정제.csv 업로드) → **[창 4 분석]**  \n> **교안** p.62 템플릿 · 63 프롬프트 · 64 예상 결과\n\n```text\n첨부한 파일은 3교시에 정제한 「강원_화재_2024_정제.csv」야.\n1행 = 화재 1건, 2024년 강원 18개 시군, 1,900행이야.\n\n'시_군_구'별 화재 건수와 비율(%)을 계산해서 큰 순서로 표로 보여줘.\n· 가장 많은 시군과 가장 적은 시군\n· 상위 3개 시군이 전체에서 차지하는 비율\n· 분모(전체 행 수)를 함께 적어줘\n\n원인은 추측하지 말고, 숫자로 확인되는 사실만 말해줘.\n파이썬 코드로 계산하고 계산 과정을 보여줘.\n```\n\n> **정답** 원주시 308 · 강릉시 253 · 춘천시 243 (상위 3개 804건 = 42.3%) · 최소 태백시·양구군 44\n\n> **참고** 그래프도 보려면: 표 답을 받은 뒤 같은 창에 '방금 결과를 그래프로 그려줘' 한 줄만 따로 보냅니다 (프롬프트에 섞으면 잘 안 됩니다)\n\n### CARD 3-2 · 질문 ② 어느 달 · 계절에 증가하는가? [추세]\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**  \n> **교안** p.65 프롬프트 · 66 예상 결과\n\n```text\n같은 파일로 계속하자.\n\n1. '월'별 화재 건수를 1월~12월 순서로 표로 보여주고,\n   전월 대비 증감률(%)도 함께 계산해줘.\n2. 가장 많은 달과 가장 적은 달을 알려줘.\n3. '계절'별 건수와 비율(%)도 표로 보여줘. (분모 1,900)\n4. 1~12월 합계가 전체 행 수와 같은지 확인해줘.\n\n특징은 2줄로 설명하되, 원인은 단정하지 말고 '가능성'으로 표현해줘.\n```\n\n> **정답** 최다 4월 189 · 최소 10월 112 · 봄 541(28.5%) · 합계 1,900\n\n> **참고** 그래프도 보려면: 표 답을 받은 뒤 같은 창에 '방금 결과를 그래프로 그려줘' 한 줄만 따로 보냅니다 (프롬프트에 섞으면 잘 안 됩니다)\n\n### CARD 3 · 질문 ③ 주요 발화요인은? — 드릴다운 [순위·구성]\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**  \n> **교안** p.67 프롬프트 · 68 예상 결과\n\n```text\n같은 파일로 계속하자.\n\n1. '발화요인대분류'별 화재 건수와 비율(%)을 큰 순서로 표로 보여줘.\n   비율은 소수점 첫째 자리, 분모는 1,900건이야.\n2. 1위와 2위 원인의 합이 전체의 몇 %인지 계산해줘.\n3. 1위 원인 안에서 '발화요인소분류'별 건수를 다시 나눠서\n   상위 5개를 표로 보여주고, 1위 원인 안에서의 비율도 알려줘.\n4. 비율 합계가 100%인지 확인해줘.\n\n원인은 데이터에 있는 분류 그대로만 쓰고, 추측해서 덧붙이지 마.\n```\n\n> **정답** 부주의 862(45.4%) + 전기적 요인 664(34.9%) = 80.3% · 담배꽁초 310 (부주의의 36.0%)\n\n> **참고** 그래프도 보려면: 표 답을 받은 뒤 같은 창에 '방금 결과를 그래프로 그려줘' 한 줄만 따로 보냅니다 (프롬프트에 섞으면 잘 안 됩니다)\n\n### CARD 3-3 · 질문 ④ 건수 많은 지역 = 피해 큰 지역? [비교]\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**  \n> **교안** p.69 프롬프트 · 70 예상 결과\n\n```text\n같은 파일로 계속하자.\n\n1. 시_군_구별로 화재 건수, 재산피해 합계(억원), 사망+부상을\n   한 표로 만들고, 건수 순위와 재산피해 순위를 나란히 보여줘.\n2. 두 순위가 크게 다른 시군을 찾아줘.\n3. 재산피해 상위 3개 시군 각각에서 '가장 큰 화재 1건'이\n   그 시군 재산피해의 몇 %인지 계산해줘.\n4. 전체 화재 1건당 재산피해의 평균과 중앙값을 비교해줘.\n\n원인은 추측하지 말고, 숫자로 확인 가능한 사실만 말해줘.\n```\n\n> **정답** 피해 1위 춘천 60.9억(최대 1건 55.1%) · 2위 원주 38.7억 · 3위 평창 30.3억(최대 1건 70.6%)  \n> 1건당 평균 13,938천원 vs 중앙값 449천원\n\n> **참고** 그래프도 보려면: 표 답을 받은 뒤 같은 창에 '방금 결과를 그래프로 그려줘' 한 줄만 따로 보냅니다 (프롬프트에 섞으면 잘 안 됩니다)\n\n### 검산할 때 되묻는 문장\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**  \n> **교안** p.71 피벗 검산\n\n```text\n엑셀 피벗으로 세어 보니 [○○]인데, 네가 계산한 기준(파일 · 필터 · 분모)을 단계별로 보여줘.\n```\n\n- 방금 답한 숫자들을 파이썬 코드로 다시 계산해서, 계산 과정과 결과를 표로 보여줘.\n- 위 설명 중 원인을 단정한 문장이 있으면 찾아서 '가능성' 표현으로 고쳐줘.\n\n## 5교시 · 시각화 (4교시 채팅에서 이어서)\n\n### CARD 4 — 결과표 4개를 차트 4개로\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]** (5교시도 같은 창)  \n> **교안** p.78 프롬프트 · 79 예상 결과\n\n```text\n앞의 분석 결과 4개로 차트를 하나씩 그려줘.\n\n① 월별 화재 건수 → 선 그래프\n② 시군별 화재 건수 → 가로 막대 (큰 순서, 위에서부터)\n③ 발화요인대분류 비중 → 도넛 (상위 4개 + 나머지 '기타')\n④ 시군별 재산피해(억원) → 가로 막대 (큰 순서, 상위 8개)\n\n모든 차트 공통 규칙:\n· 세로축(값 축)은 0부터, 축과 제목에 단위(건 · 억원)\n· 강조색은 1개만 — 가장 중요한 항목에\n· 값 라벨 표시 (천 단위 쉼표)\n· 제목은 '무엇이 보이는가'를 숫자 1개 포함한 한 문장으로\n· 차트 아래에 '출처: 소방청 연간화재통계(2024) · 강원' 한 줄\n```\n\n### 차트 다듬기 — 한 번에 하나씩\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**  \n> **교안** p.81 수정 지시\n\n- 막대를 큰 값부터 위에서 아래로 정렬해줘.\n- 1위 막대만 빨간색, 나머지는 회색으로 바꿔줘.\n- 세로축을 0부터 시작하고, 축 제목에 단위 '건'을 넣어줘.\n- 상위 8개만 보여주고 나머지는 '기타'로 묶어줘.\n- 제목을 결론을 말하는 한 문장으로, 숫자 1개를 넣어서 바꿔줘.\n- 값을 막대 끝에 천 단위 쉼표로 표시해줘.\n- 이 차트의 축 시작값, 단위, 비율의 분모를 알려줘.\n- (차트가 안 그려질 때) 파이썬 코드 실행으로 차트 이미지를 만들어줘.\n\n## 6교시 · 대시보드 (스킬: Gem ③ 「대시보드 빌더」) · 입력창 [도구] → Canvas 켜기\n\n### CARD 5 — 대시보드 (일반 채팅용 전체판) · 파일: 강원_화재_2024_정제.csv\n\n> **채팅** 일반 채팅 · 이어서 — **[창 4 분석]**에서 입력창 [도구] → Canvas 켜기 (창이 너무 길면 새 채팅 + 정제 CSV 업로드)  \n> ※ 아래 Gem ③판과 둘 중 하나만  \n> **교안** p.85 Canvas 열기 · 87 프롬프트 · 88 예상 결과\n\n```text\n[강원_화재_2024_정제.csv]로 HTML 대시보드 한 장을 Canvas에 만들어줘.\n\n[조건]\n- 파일 하나로 열리는 HTML. 외부 라이브러리 · CDN · 웹폰트 없이, 차트는 SVG로 직접 그려줘.\n- 데이터는 HTML 안에 넣고, 외부 서버로 보내는 코드는 넣지 마.\n- 원자료 1,900행을 그대로 넣지 말고, 파이썬으로 [시군 × 월 × 발화요인] 집계표\n  (건수 · 인명피해 · 재산피해_억원)를 만들어 그 집계표만 넣어줘.\n\n[구성]\n① 제목: [2024 강원 화재 현황]  /  필터: [시군], [월] — 기본값 '전체',\n   필터를 바꾸면 KPI와 모든 차트가 함께 바뀌게\n② KPI 4개: [화재 건수(건)], [인명피해(사망+부상, 명)], [재산피해(억원)], [최다 발화요인과 비율]\n③ 차트 4개: [월별 추이 선], [시군 순위 가로 막대 상위 10], [발화요인 도넛 상위 4 + 기타],\n   [시군별 재산피해 가로 막대 상위 8]\n   — 세로축 0, 제목은 숫자 1개를 포함한 결론 문장, 강조색 1개(빨강), 기본색 남색\n④ 인사이트 2줄: [사실] / [가설] 태그\n⑤ 업무 제안 후보 2개: 누가 · 무엇을 · 언제 + '[담당자 확정]'\n⑥ 하단: 출처(소방청 연간화재통계 2024) · 재산피해 천원→억원 환산 ·\n   한계(출동시간 없음) · 'AI(Gemini) 활용 작성 · 담당자 검증'\n\n먼저 KPI 숫자를 표로 따로 보여주고(검산용), 그다음 HTML을 만들어줘.\n```\n\n> **정답** 1,900건 · 134명 · 264.8억원 · 부주의 45.4% · 시군=강릉시 → 253건\n\n### CARD 5 — Gem ③ 「대시보드 빌더」용 짧은 입력\n\n> **채팅** Gem ③ · 새 채팅 (Gem ③ 링크를 열고 정제 CSV 업로드 · [도구] → Canvas 켜기) → **[창 6 Gem③]**  \n> **교안** p.86 스킬 ③ 설명 · 115 요청사항 원문\n\n```text\n업무 질문: [화재 예방 활동을 강원 어느 지역 · 어느 시기 · 어떤 원인에 집중해야 하는가?]\n필터: [시군, 월]\nKPI: [화재 건수, 인명피해, 재산피해(억원), 최다 발화요인]\n```\n\n> **참고** 설계안이 나오면 확인 후 \"좋아, 만들어줘\"라고 답합니다.\n\n### 대시보드 다듬기 — Canvas에 한 번에 하나씩\n\n> **채팅** 이어서 — 대시보드를 만든 그 창 (**[창 4 분석]** 일반 채팅 또는 **[창 6 Gem③]**)  \n> **교안** p.89 수정 지시 · 90 저장 · 재검산\n\n- 모든 KPI와 차트가 필터 선택에 함께 반응하도록 고쳐줘.\n- `<meta charset=\"UTF-8\">`을 넣고 한글 글꼴을 'Malgun Gothic'으로 지정해줘.\n- 외부 라이브러리 없이 SVG로 차트를 다시 그려줘.\n- 색은 남색 1개 + 강조 빨강 1개만, 그림자 · 애니메이션은 빼줘.\n- 맨 아래에 출처 · 기준일 · 한계 · 'AI 활용 작성 · 담당자 검증'을 추가해줘.\n- KPI 4개의 계산식과 값을 표로 보여줘. 필터 '전체' 기준으로.\n- A4 가로 1쪽에 맞게 인쇄 레이아웃(@media print)을 추가해줘.\n- (Canvas가 안 될 때) 이 대시보드를 HTML 파일 하나로 만들어 코드 블록으로 줘.\n  → 메모장에 붙여넣고 '강원화재_대시보드.html'로 저장 (인코딩 UTF-8)\n"}, {"name": "7~8교시 · CASE 2 나만의 데이터", "md": "# D2 · 프롬프트 카드 — 공공데이터 활용 · 분석 · 시각화\n\nFIRE-AI 2026 · 수강생 배포용 · 실습 도구: Gemini (gemini.google.com) · 교안 v0.3 기준 · 2026-10-09\n\n> **이 파일** 7\\~8교시 · CASE 2 나만의 데이터 · 나만의 대시보드   (전체본: 프롬프트카드_D2.txt)\n\n## 이 단락에서 쓰는 채팅 창\n\n- **[창 7-A 캔버스]** — 일반 채팅 (캔버스 점검)\n- **[창 7-G Gem②]** — Gem ② (내 데이터 정제)\n- **[창 7-B 분석]** — 일반 채팅 (나만의_정제.csv로 CARD 3 치환판)\n- **[창 8 대시보드]** — 일반 채팅 + Canvas (또는 Gem ③)\n\n## 시작하기 전에\n\n### 카드 읽는 법\n\n- **교안 페이지** 각 카드 아래 '▶ 교안 p.NN'은 강원소방학교_AI데이터활용_2일차_v0.3.pptx 기준입니다. 교안 페이지가 var WINCOL = {"1":"--w1","2":"--w2","2-G":"--wg","3-A":"--w3a","3-B":"--w3b","3-G":"--wg","4":"--w4","6":"--w6","7-A":"--w7a","7-G":"--wg","7-B":"--w7b","8":"--w8"};
var WINORDER = ["1","2","2-G","3-A","3-B","3-G","4","6","7-A","7-G","7-B","8"];

/* ── 글자 크기 · 테마 ── */
var fs = parseFloat(store.get("d2card_fs")) || 16;
function applyFs(){ document.documentElement.style.setProperty("--fs", fs + "px"); }
applyFs();
$("#fsm").onclick = function(){ fs = Math.max(13, fs - 1); applyFs(); store.set("d2card_fs", fs); };
$("#fsp").onclick = function(){ fs = Math.min(26, fs + 2); applyFs(); store.set("d2card_fs", fs); };
var th = store.get("d2card_theme"); if(th) document.documentElement.setAttribute("data-theme", th);
$("#theme").onclick = function(){
  var dark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  var v = dark ? "light" : "dark"; document.documentElement.setAttribute("data-theme", v); store.set("d2card_theme", v);
};

/* ── 복사 ── */
function fallbackCopy(t){
  var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  var ok = false; try{ ok = document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); return ok;
}
/* 복사한 카드 기억 (글 내용 기준 → 전체 탭 · 단락 탭에서 같은 카드는 같이 표시, 새로고침해도 유지) */
var COPYKEY = "d2card_copied", copied = {};
try{ copied = JSON.parse(store.get(COPYKEY) || "{}") || {}; }catch(e){ copied = {}; }
function hkey(t){ var h = 5381; for(var i = 0; i < t.length; i++){ h = ((h << 5) + h + t.charCodeAt(i)) | 0; } return (h >>> 0).toString(36) + "." + t.length; }
function saveCopied(){ store.set(COPYKEY, JSON.stringify(copied)); }
function setBtn(b, on){ b.classList.toggle("done", on); b.textContent = on ? "복사됨 ✓" : "복사";
  b.title = on ? "복사한 적 있음 — 다시 눌러도 복사됩니다" : "누르면 복사"; }
function copyText(t, btn){
  var done = function(){
    if(btn){ copied[btn.dataset.k] = Date.now(); saveCopied();
      $$('.copy[data-k="' + btn.dataset.k + '"]').forEach(function(b){ setBtn(b, true); }); updCounts(); }
    toast("복사했습니다 — Gemini 입력창에 Ctrl+V"); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done, function(){ if(fallbackCopy(t)) done(); else toast("복사가 막혔습니다. 직접 드래그해서 복사하세요"); });
  } else if(fallbackCopy(t)) done(); else toast("복사가 막혔습니다. 직접 드래그해서 복사하세요");
}
var tt; function toast(m){ var e = $("#toast"); e.textContent = m; e.classList.add("on"); clearTimeout(tt); tt = setTimeout(function(){ e.classList.remove("on"); }, 1700); }
function mkCopy(getText){
  var b = document.createElement("button"); b.className = "copy"; b.type = "button";
  b.dataset.k = hkey(getText()); setBtn(b, !!copied[b.dataset.k]);
  b.onclick = function(ev){ ev.stopPropagation(); copyText(getText(), b); }; return b;
}
/* 초기화: 전체 = 모든 탭의 복사 표시 / 현재 창 = 지금 탭에서 '창별로 보기' · 찾기 조건으로 보이는 카드만 */
function visibleBtns(){ return $$("#doc .copy").filter(function(b){ return !b.closest(".hide"); }); }
function updCounts(){
  var all = Object.keys(copied).length;
  var vis = visibleBtns().filter(function(b){ return copied[b.dataset.k]; }).map(function(b){ return b.dataset.k; });
  vis = vis.filter(function(k, i){ return vis.indexOf(k) === i; }).length;
  $("#rsall").querySelector("b").textContent = all; $("#rsview").querySelector("b").textContent = vis;
  $("#rsall").disabled = !all; $("#rsview").disabled = !vis;
}
function twoStep(btn, run){
  if(btn.dataset.arm === "1"){ btn.dataset.arm = ""; clearTimeout(btn._t); btn.classList.remove("arm"); btn.innerHTML = btn.dataset.lbl; run(); return; }
  btn.dataset.lbl = btn.innerHTML; btn.dataset.arm = "1"; btn.classList.add("arm"); btn.textContent = "한 번 더 누르면 초기화";
  btn._t = setTimeout(function(){ btn.dataset.arm = ""; btn.classList.remove("arm"); btn.innerHTML = btn.dataset.lbl; }, 3000);
}
$("#rsall").onclick = function(){ var me = this; twoStep(me, function(){
  var n = Object.keys(copied).length; copied = {}; saveCopied();
  $$("#doc .copy").forEach(function(b){ setBtn(b, false); }); updCounts(); toast("전체 복사 표시 " + n + "개를 초기화했습니다"); }); };
$("#rsview").onclick = function(){ var me = this; twoStep(me, function(){
  var n = 0; visibleBtns().forEach(function(b){ if(copied[b.dataset.k]){ delete copied[b.dataset.k]; n++; } });
  saveCopied(); $$("#doc .copy").forEach(function(b){ setBtn(b, !!copied[b.dataset.k]); }); updCounts();
  var cond = [docs[cur].name]; if(winFilter){ var c = $(".chip.w[aria-pressed=true]"); cond.push(c ? c.textContent : "창 " + winFilter); } if(query.trim()) cond.push("찾기 '" + query.trim() + "'");
  toast(cond.join(" · ") + " — " + n + "개를 초기화했습니다"); }); };

/* ── 탭 ── */
function drawTabs(){
  var nav = $("#tabs"); nav.innerHTML = "";
  docs.forEach(function(d, i){
    var b = document.createElement("button"); b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === cur ? "true" : "false"); b.textContent = d.name;
    b.onclick = function(){ show(i); };
    nav.appendChild(b);
  });
}
function show(i){
  cur = i; store.set("d2card_tab", String(i)); winFilter = "";
  try{ history.replaceState(null, "", "#tab=" + (i + 1)); }catch(e){}
  drawTabs(); render(); window.scrollTo(0, 0);
}

/* ── 그리기 ── */
function winBadge(id, label){
  var s = document.createElement("span"); s.className = "win"; s.dataset.w = id;
  s.style.setProperty("--c", "var(" + (WINCOL[id] || "--w1") + ")"); s.textContent = label; return s;
}
function pillify(root){
  var re = /(새 채팅|이어서|Gem ?[①②③]|일반 채팅)/g;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], n;
  while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(function(t){
    if(!re.test(t.nodeValue)){ re.lastIndex = 0; return; } re.lastIndex = 0;
    if(t.parentNode.closest(".win")) return;
    var frag = document.createDocumentFragment(), last = 0, v = t.nodeValue, m;
    while((m = re.exec(v))){
      if(m.index > last) frag.appendChild(document.createTextNode(v.slice(last, m.index)));
      var p = document.createElement("span"); p.className = "pill " + (m[1] === "새 채팅" ? "new" : m[1] === "이어서" ? "cont" : m[1] === "일반 채팅" ? "gen" : "gem");
      p.textContent = m[1]; frag.appendChild(p); last = m.index + m[0].length;
    }
    if(last < v.length) frag.appendChild(document.createTextNode(v.slice(last)));
    t.parentNode.replaceChild(frag, t);
  });
}
function render(){
  var d = docs[cur], main = $("#doc");
  $("#src").textContent = DATA.ver ? "교안 " + DATA.ver + " 기준" : "";
  var html = marked.parse(d.md, {gfm:true, breaks:false});
  var tmp = document.createElement("div"); tmp.innerHTML = html;
  /* 창 배지: **[창 3-B 소방용수]** */
  $$("strong", tmp).forEach(function(s){
    var m = /^\[창 ([0-9]+(?:-[A-Z])?)\s*([^\]]*)\]$/.exec(s.textContent.trim());
    if(m) s.parentNode.replaceChild(winBadge(m[1], "창 " + m[1] + (m[2] ? " " + m[2] : "")), s);
  });
  /* 인용 상자 종류 */
  $$("blockquote", tmp).forEach(function(b){
    var f = b.querySelector("strong"), k = f ? f.textContent.trim() : "";
    var cls = k === "채팅" || k === "교안" ? "meta" : k === "정답" ? "ans" : k === "참고" ? "tip" : "info";
    b.classList.add(cls);
    $$("strong", b).forEach(function(s){ if(/^(채팅|교안|정답|참고|이 파일)$/.test(s.textContent.trim())) s.classList.add("k"); });
    if(cls === "meta") pillify(b);
  });
  /* 구역 나누기: h2 → .sec, h3(교시 구역 안) → .card */
  main.innerHTML = "";
  var sec = null, card = null, k = 0, kids = Array.prototype.slice.call(tmp.childNodes);
  kids.forEach(function(el){
    if(el.nodeType === 1 && el.tagName === "H2"){
      sec = document.createElement("section"); sec.className = "sec";
      if(!/교시|부록/.test(el.textContent)) sec.classList.add("intro");
      el.id = "s" + (k++); sec.appendChild(el); main.appendChild(sec); card = null; return;
    }
    if(el.nodeType === 1 && el.tagName === "H3" && sec && !sec.classList.contains("intro")){
      card = document.createElement("div"); card.className = "card"; el.id = "s" + (k++);
      var hd = document.createElement("div"); hd.className = "hd"; hd.appendChild(el);
      card.appendChild(hd); sec.appendChild(card); return;
    }
    if(el.nodeType === 1 && el.tagName === "H3"){ el.id = "s" + (k++); }
    (card || sec || main).appendChild(el);
  });
  /* '시작하기 전에'는 접기 (전체 탭만 펼침) · '이 단락에서 쓰는 채팅 창'은 상자로 */
  $$(".sec.intro", main).forEach(function(s){
    var h2 = s.querySelector("h2"), t = h2.textContent.trim();
    if(/^시작하기 전에/.test(t)){
      h2.classList.add("tg"); h2.tabIndex = 0; h2.setAttribute("role", "button");
      var key = "d2card_fold_" + cur, sv = store.get(key);
      var folded = sv === null ? cur !== 0 : sv === "1";
      s.classList.toggle("fold", folded); h2.setAttribute("aria-expanded", folded ? "false" : "true");
      var tog = function(){ var f = s.classList.toggle("fold"); h2.setAttribute("aria-expanded", f ? "false" : "true"); store.set(key, f ? "1" : "0"); };
      h2.onclick = tog; h2.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); tog(); } };
    }
    if(/^이 단락에서 쓰는 채팅 창/.test(t)) s.classList.add("first");
  });
  /* 카드 머리 태그 · 창 정보 */
  $$(".card", main).forEach(function(c){
    var meta = c.querySelector("blockquote.meta"), tags = document.createElement("div"); tags.className = "tags";
    var ids = [];
    if(meta){
      var txt = meta.textContent;
      var first = txt.split("※")[0], gm = /Gem ?([①②③])/.exec(first.split("→")[0]);
      var ty = document.createElement("span");
      if(/^\s*채팅\s*Gem/.test(first) && gm){ ty.className = "pill gem"; ty.textContent = "Gem " + gm[1]; tags.appendChild(ty); }
      else if(/^\s*채팅\s*일반 채팅/.test(first)){ ty.className = "pill gen"; ty.textContent = "일반 채팅"; tags.appendChild(ty); }
      if(/새 채팅/.test(first)){ var p = document.createElement("span"); p.className = "pill new"; p.textContent = "새 채팅"; tags.appendChild(p); }
      else if(/이어서/.test(txt)){ var q = document.createElement("span"); q.className = "pill cont"; q.textContent = "이어서"; tags.appendChild(q); }
      $$(".win", meta).forEach(function(w){ if(ids.indexOf(w.dataset.w) < 0){ ids.push(w.dataset.w); tags.appendChild(winBadge(w.dataset.w, w.textContent)); } });
    }
    c.dataset.wins = ids.join(" ");
    if(tags.childNodes.length) c.querySelector(".hd").appendChild(tags);
  });
  /* 복사 버튼 */
  $$("pre", main).forEach(function(pre){
    var w = document.createElement("div"); w.className = "pre"; pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
    w.appendChild(mkCopy(function(){ return pre.textContent.replace(/\n+$/, ""); }));
  });
  $$(".card li", main).forEach(function(li){
    if(li.querySelector("ul,ol,pre")) return;
    li.classList.add("cp");
    var t = li.textContent.trim(); li.appendChild(mkCopy(function(){ return t; }));
  });
  $$(".sec:not(.intro) table tr", main).forEach(function(tr){
    var td = tr.querySelectorAll("td"); if(td.length < 2) return;
    var c = td[td.length - 1], t = c.textContent.trim(); c.classList.add("cpc"); c.appendChild(mkCopy(function(){ return t; }));
  });
  drawToc(); drawWins(); applyFilter();
}

/* ── 목차 ── */
var obs;
function drawToc(){
  var toc = $("#toc"); toc.innerHTML = "";
  $$("#doc h2, #doc .card h3, #doc .intro h3").forEach(function(h){
    var a = document.createElement("a"); a.href = "#" + h.id; a.className = h.tagName.toLowerCase();
    a.textContent = h.textContent.replace(/\s*\(v\d+\.\d+\)\s*$/, ""); a.dataset.t = h.id;
    a.onclick = function(ev){ ev.preventDefault(); var f = h.closest(".sec.fold"); if(f && h.tagName !== "H2"){ f.classList.remove("fold"); }
      h.scrollIntoView({behavior:"smooth", block:"start"}); toc.classList.remove("open"); };
    toc.appendChild(a);
  });
  if(obs) obs.disconnect();
  if("IntersectionObserver" in window){
    obs = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){
        $$("#toc a.on").forEach(function(a){ a.classList.remove("on"); });
        var a = $('#toc a[data-t="' + e.target.id + '"]'); if(a){ a.classList.add("on"); }
      }});
    }, {rootMargin:"-150px 0px -65% 0px"});
    $$("#doc h2, #doc h3").forEach(function(h){ obs.observe(h); });
  }
}
$("#tocbtn").onclick = function(){ $("#toc").classList.toggle("open"); };

/* ── 창 거르기 · 찾기 ── */
function drawWins(){
  var box = $("#wins"), have = {};
  $$("#doc .card").forEach(function(c){ (c.dataset.wins || "").split(" ").forEach(function(w){ if(w) have[w] = 1; }); });
  box.innerHTML = "";
  var ids = WINORDER.filter(function(w){ return have[w]; });
  if(!ids.length){ box.classList.add("hide"); return; } box.classList.remove("hide");
  var l = document.createElement("span"); l.className = "lbl"; l.textContent = "창별로 보기"; box.appendChild(l);
  var all = document.createElement("button"); all.className = "chip"; all.type = "button"; all.textContent = "전체";
  all.setAttribute("aria-pressed", winFilter ? "false" : "true"); all.onclick = function(){ winFilter = ""; drawWins(); applyFilter(); }; box.appendChild(all);
  var names = {};
  $$("#doc .card .hd .win").forEach(function(w){ if(!names[w.dataset.w]) names[w.dataset.w] = w.textContent; });
  ids.forEach(function(w){
    var b = document.createElement("button"); b.className = "chip w"; b.type = "button"; b.textContent = names[w] || ("창 " + w);
    b.style.setProperty("--c", "var(" + (WINCOL[w] || "--w1") + ")");
    b.setAttribute("aria-pressed", winFilter === w ? "true" : "false");
    b.onclick = function(){ winFilter = winFilter === w ? "" : w; drawWins(); applyFilter(); window.scrollTo(0, 0); };
    box.appendChild(b);
  });
}
function clearMarks(root){ $$("mark", root).forEach(function(m){ m.parentNode.replaceChild(document.createTextNode(m.textContent), m); }); root.normalize(); }
function markText(root, q){
  if(!q) return; var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], n;
  while((n = walker.nextNode())) if(!n.parentNode.closest("button")) nodes.push(n);
  var ql = q.toLowerCase();
  nodes.forEach(function(t){
    var v = t.nodeValue, i = v.toLowerCase().indexOf(ql); if(i < 0) return;
    var frag = document.createDocumentFragment(), last = 0;
    while(i >= 0){ frag.appendChild(document.createTextNode(v.slice(last, i)));
      var m = document.createElement("mark"); m.textContent = v.slice(i, i + q.length); frag.appendChild(m);
      last = i + q.length; i = v.toLowerCase().indexOf(ql, last); }
    frag.appendChild(document.createTextNode(v.slice(last))); t.parentNode.replaceChild(frag, t);
  });
}
function applyFilter(){
  var main = $("#doc"); clearMarks(main);
  var q = query.trim(), any = false;
  $$(".card", main).forEach(function(c){
    var okW = !winFilter || (" " + c.dataset.wins + " ").indexOf(" " + winFilter + " ") >= 0;
    var okQ = !q || c.textContent.toLowerCase().indexOf(q.toLowerCase()) >= 0;
    c.classList.toggle("hide", !(okW && okQ)); if(okW && okQ) any = true;
  });
  var filtering = !!(winFilter || q);
  $$(".sec", main).forEach(function(s){
    if(s.classList.contains("intro")){ s.classList.toggle("hide", filtering); return; }
    var cards = $$(".card", s);
    s.classList.toggle("hide", filtering && cards.length > 0 && !cards.some(function(c){ return !c.classList.contains("hide"); }) ||
      filtering && cards.length === 0 && !(q && s.textContent.toLowerCase().indexOf(q.toLowerCase()) >= 0));
  });
  $$("h1, h1 + p, main > blockquote", main).forEach(function(e){ e.classList.toggle("hide", filtering); });
  var em = $("#empty"); if(em) em.remove();
  if(filtering && !any && !$$(".sec:not(.hide)", main).length){
    em = document.createElement("p"); em.id = "empty"; em.textContent = "맞는 카드가 없습니다."; main.appendChild(em);
  }
  if(q) $$(".card:not(.hide), .sec:not(.hide) table", main).forEach(function(c){ markText(c, q); });
  $$("#toc a").forEach(function(a){ var t = document.getElementById(a.dataset.t); a.classList.toggle("dim", !!(t && t.closest(".hide"))); });
  updCounts();
}
var qt; $("#q").addEventListener("input", function(e){ clearTimeout(qt); qt = setTimeout(function(){ query = e.target.value; applyFilter(); }, 120); });
document.addEventListener("keydown", function(e){
  if(e.key === "/" && document.activeElement !== $("#q") && !e.ctrlKey && !e.metaKey){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape" && document.activeElement === $("#q")){ $("#q").value = ""; query = ""; applyFilter(); $("#q").blur(); }
});

window.addEventListener("storage", function(e){ if(e.key === COPYKEY){ try{ copied = JSON.parse(e.newValue || "{}") || {}; }catch(x){ copied = {}; }
  $$("#doc .copy").forEach(function(b){ setBtn(b, !!copied[b.dataset.k]); }); updCounts(); } });

/* ── 시작 ── */
var h = /tab=(\d+)/.exec(location.hash), saved = parseInt(store.get("d2card_tab"), 10);
cur = h ? Math.min(docs.length - 1, Math.max(0, parseInt(h[1], 10) - 1)) : (saved >= 0 && saved < docs.length ? saved : 0);
drawTabs(); render();
})();
</script>
</body>
