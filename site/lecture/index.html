<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#132b52">
  <title>BOMTS 강의 자료</title>
  <meta name="description" content="강의 중 교안과 실습 자료를 빠르게 여는 QR 슬라이드입니다.">
  <link rel="stylesheet" href="assets/lecture.css">
  <script defer src="assets/lecture.js"></script>
</head>
<body>
  <main class="deck" aria-label="BOMTS 강의 자료 QR">
    <section class="slide is-active" data-slide="1" aria-labelledby="slide-1-title">
      <div class="slide-content">
        <p class="eyebrow">먼저 접속하세요</p>
        <h1 id="slide-1-title">교안 PDF · 오늘 자료 받기</h1>
        <div class="qr-frame" aria-label="강원소방학교 공유 드라이브 QR 코드">
          <div class="qr-crop qr-crop-1">
            <img src="assets/slide-01.png" alt="강원소방학교 공유 드라이브로 연결되는 QR 코드">
          </div>
        </div>
        <a class="resource-link" href="https://drive.google.com/drive/folders/1Z70Bjg8t86v7Mh7w6-7gysei9kZTX0_j?usp=sharing" target="_blank" rel="noopener noreferrer">공유 드라이브 열기 <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="slide" data-slide="2" aria-labelledby="slide-2-title" aria-hidden="true">
      <div class="slide-content">
        <p class="eyebrow">자료 1</p>
        <h1 id="slide-2-title">공유 드라이브 폴더</h1>
        <p class="resource-name">261013_강원소방학교</p>
        <div class="qr-frame" aria-label="강원소방학교 공유 드라이브 QR 코드">
          <div class="qr-crop qr-crop-2">
            <img src="assets/slide-02.png" alt="강원소방학교 공유 드라이브로 연결되는 QR 코드">
          </div>
        </div>
        <p class="description">교안 PDF · 실습 데이터 · 워크시트 · 주제 카드</p>
        <a class="resource-link" href="https://drive.google.com/drive/folders/1Z70Bjg8t86v7Mh7w6-7gysei9kZTX0_j?usp=sharing" target="_blank" rel="noopener noreferrer">링크 열기 <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="slide" data-slide="3" aria-labelledby="slide-3-title" aria-hidden="true">
      <div class="slide-content">
        <p class="eyebrow">자료 2</p>
        <h1 id="slide-3-title">프롬프트 카드</h1>
        <p class="resource-name">프롬프트카드_D2.html</p>
        <div class="qr-frame" aria-label="프롬프트 카드 파일 QR 코드">
          <div class="qr-crop qr-crop-3">
            <img src="assets/slide-03.png" alt="프롬프트 카드 파일로 연결되는 QR 코드">
          </div>
        </div>
        <p class="description accent">오늘 모든 프롬프트 · 복사 버튼 제공</p>
        <a class="resource-link" href="https://drive.google.com/file/d/1GDMMMpBlGVnkVhLjVy1ZvWV-rX5wLUc8/view?usp=drive_link" target="_blank" rel="noopener noreferrer">링크 열기 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <header class="brand" aria-label="사이트 이름">BOMTS <span>LECTURE</span></header>
  <div class="hint" aria-hidden="true">화면 양쪽 클릭 · ← → 키 · 좌우 밀기</div>
  <nav class="controls" aria-label="슬라이드 이동">
    <button class="control" id="previous" type="button" aria-label="이전 슬라이드">←</button>
    <output class="counter" id="counter" aria-live="polite">1 / 3</output>
    <button class="control" id="next" type="button" aria-label="다음 슬라이드">→</button>
    <button class="control fullscreen" id="fullscreen" type="button" aria-label="전체 화면">⛶</button>
  </nav>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
</body>
</html>
