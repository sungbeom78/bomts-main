services:
  website:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOMTS_HTTP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
