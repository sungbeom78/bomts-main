services:
  website:
    build:
      context: .
    container_name: bomts_public_website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
      - "${BOMTS_HOST_NETWORK_IP:?set BOMTS_HOST_NETWORK_IP in .env}:3001:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
