map "$http_cf_connecting_ip:$remote_addr" $bomts_local_request {
  default 0;
  ~^:(127\.0\.0\.1|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /local/context.json {
    if ($bomts_local_request = 0) { return 404; }
    access_log off;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 200 '{"local":true,"manual":"/manual/","admin":"/manual/admin.html"}\n';
  }

  location = /manual {
    if ($bomts_local_request = 0) { return 404; }
    return 302 /manual/;
  }

  location ^~ /manual/ {
    if ($bomts_local_request = 0) { return 404; }
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "private, no-store" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
