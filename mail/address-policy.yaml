version: 1
domain: bomts.net
catch_all: false

mailboxes:
  - address: founder@bomts.net
    purpose: Claude Console, Claude Startups, and critical business mail
    access: founder-only
  - address: admin@bomts.net
    purpose: infrastructure notifications
    access: administrator-only
  - address: ott.disney@bomts.net
    purpose: Disney service registration and verification mail
    access: separate-user-only
  - address: ott.netflix@bomts.net
    purpose: Netflix service registration and verification mail
    access: separate-user-only

aliases:
  - address: contact@bomts.net
    destination: founder@bomts.net
  - address: abuse@bomts.net
    destination: admin@bomts.net

controls:
  founder_password_shared: false
  admin_publicly_exposed: false
  admin_mfa_required: true
